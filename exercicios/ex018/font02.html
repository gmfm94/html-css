<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'alice' ;
            src: url('Alice_in_Wonderland_3.ttf') format(truetype);
            font-weight: normal;
            font-style: normal;

            /*
            Tipos de format: 
            opentype (otf)
            truetype (ttf)
            embedded-opentype
            truetype-aat (Apple Advanced Typography)
            svg
            */

        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            
        }

        h1 {
            font-family: 'alice' ;
            font-size: 5em;
            text-align: center;
        }

    
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus corporis fugit neque nisi earum natus dicta nesciunt mollitia maiores in, dolorum excepturi blanditiis aperiam, magnam accusamus quasi tenetur saepe? Fugiat.</p>

    
        
       
       
   
</body>
</html>
